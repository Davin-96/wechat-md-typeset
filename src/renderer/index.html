<!DOCTYPE html>
<html lang="zh-CN" data-ui-mode="auto">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; script-src 'self'; connect-src 'self' https: http:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选题排版工作台</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/topics.css">
  <script src="js/boot.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
    <div class="grid-tex"></div>
  </div>

  <div id="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-mark">选</div>
        <span class="brand-name" id="appTitle" title="点击修改工作台名称">选题排版工作台</span>
        <input class="brand-name-input hidden" id="appTitleInput" maxlength="24" aria-label="工作台名称" autocomplete="off">
        <button id="renameBtn" class="rename-btn" title="修改工作台名称" aria-label="修改工作台名称">✎</button>
      </div>
      <span class="topbar-sep" aria-hidden="true"></span>
      <div class="seg work-seg" role="tablist" aria-label="工作区切换">
        <button class="on" data-workspace="topics">选题</button>
        <button data-workspace="editor">排版</button>
      </div>
      <div class="topbar-actions">
        <button id="editThemeBtn" class="btn editor-only">编辑样式</button>
        <button id="copyBtn" class="btn btn-primary editor-only">复制到公众号</button>
        <button id="exportBtn" class="btn editor-only">导出 HTML</button>
        <button id="uiModeBtn" class="btn btn-icon" title="切换明暗" aria-label="切换明暗">☾</button>
      </div>
    </header>

    <!-- ===== 选题工作区（雷达风格） ===== -->
    <section id="topicWorkspace" class="ws-pane">
      <div class="topic-scroll">
        <div class="topic-wrap">
          <div class="topic-hero">
            <div class="topic-hero-copy">
              <div class="topic-eyebrow">TOPIC INTELLIGENCE</div>
              <h2>捕捉每一个<br><em>值得写的选题</em></h2>
              <p>左侧切换选题阶段与标签，右侧大屏浏览。点「开始写作」直接进入排版，发布后可一键回写状态。</p>
            </div>
            <div class="topic-kpis" id="topicKpis"></div>
          </div>
          <div class="topic-workbench">
            <aside class="topic-rail glass" id="topicRail"></aside>
            <main class="topic-stage glass">
              <div class="topic-stage-head">
                <div class="topic-stage-icon" id="topicStageIcon">⚡</div>
                <div class="topic-stage-title"><h2 id="topicStageTitle">待验证</h2><p id="topicStageSub">等待验证价值的选题</p></div>
                <div class="topic-stage-tools">
                  <span class="topic-stage-count" id="topicStageCount">—</span>
                  <div class="topic-search"><input id="topicSearch" type="text" placeholder="搜索标题、笔记、标签…" autocomplete="off" aria-label="搜索选题"></div>
                  <button type="button" id="topicSortBtn" class="topic-sort tp-drop-trigger" aria-haspopup="listbox" aria-expanded="false" title="排序规则" aria-label="排序规则">
                    <span class="tp-dd-label" id="topicSortLabel">自定义排序</span><span class="tp-dd-arrow">⌄</span>
                  </button>
                  <span class="topic-tools-spacer"></span>
                  <button id="topicImportBtn" class="btn">导入</button>
                  <button id="topicExportBtn" class="btn">导出</button>
                  <button id="topicNewBtn" class="btn btn-primary">＋ 新建选题</button>
                </div>
              </div>
              <div class="topic-stage-list" id="topicStageList"></div>
            </main>
          </div>
          <p class="topic-footer">数据保存在本机 · 选题与文章双向关联 · 无需云端</p>
        </div>
      </div>
      <input type="file" id="topicImportFile" accept=".json,application/json" hidden>
    </section>

    <!-- ===== 排版工作区（原三栏） ===== -->
    <section id="editorWorkspace" class="ws-pane hidden">
    <div class="workspace">
      <aside class="sidebar panel glass">
        <div class="sidebar-tabs">
          <button class="tab on" data-tab="articles">文章</button>
          <button class="tab" data-tab="themes">主题</button>
        </div>
        <div class="sidebar-body">
          <div class="tab-panel" data-panel="articles">
            <button id="newArticleBtn" class="btn btn-block">+ 新建文章</button>
            <div id="articleList" class="list"></div>
          </div>
          <div class="tab-panel hidden" data-panel="themes">
            <div class="theme-search-wrap">
              <svg viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="themeSearch" class="theme-search" placeholder="搜索主题…" autocomplete="off">
            </div>
            <div class="style-seg" id="styleSeg">
              <button class="on" data-style="all">全部 <span>50</span></button>
              <button data-style="modern">现代简约 <span>38</span></button>
              <button data-style="special">特色版式 <span>12</span></button>
            </div>
            <div class="chips" id="themeChips"></div>
            <button id="newThemeBtn" class="btn btn-block btn-new-theme">+ 新建主题</button>
            <div id="themeList"></div>
          </div>
        </div>
        <div class="sidebar-footer">
          <span id="dataDir" class="muted small"></span>
        </div>
      </aside>

      <main class="editor-pane panel">
        <div class="pane-header">
          <input id="articleTitle" class="title-input" placeholder="无标题文章">
        </div>
        <textarea id="mdEditor" class="md-editor" spellcheck="false" placeholder="在此输入 Markdown…&#10;&#10;# 标题&#10;正文段落&#10;&#10;> 引用&#10;&#10;```js&#10;code&#10;```"></textarea>
        <div class="pane-footer">
          <span id="wordCount" class="muted small">0 字</span>
          <span id="saveStatus" class="muted small"><span class="save-dot"></span>未保存</span>
        </div>
      </main>

      <section class="preview-pane panel">
        <div class="pane-header">
          <span class="pane-title">公众号预览</span>
          <button id="syncScrollBtn" class="sync-toggle on" title="左右同频滚动：开" aria-label="左右同频滚动"><span class="sync-ic">⇅</span>同步</button>
          <span id="previewThemeName" class="muted small" style="margin-left:auto"></span>
        </div>
        <div class="preview-scroll">
          <div class="preview-content-wrap">
            <div id="preview" class="article-shell"></div>
            <p class="preview-tip">预览即最终粘贴效果 · 所有样式已内联</p>
          </div>
        </div>
      </section>
    </div>
    </section>
  </div>

  <!-- 选题详情弹窗 -->
  <div id="topicDetailModal" class="modal hidden">
    <div class="modal-card topic-modal">
      <div class="modal-header"><h3>选题详情</h3><button class="btn btn-icon modal-close" data-close aria-label="关闭">✕</button></div>
      <div class="modal-body" id="topicDetailBody"></div>
    </div>
  </div>

  <!-- 新建/编辑选题弹窗 -->
  <div id="topicModal" class="modal hidden">
    <div class="modal-card topic-modal">
      <div class="modal-header"><h3 id="topicModalTitle">新建选题</h3><button class="btn btn-icon modal-close" data-close aria-label="关闭">✕</button></div>
      <div class="modal-body">
        <div class="field" id="topicFieldTitle"><label>标题 <span style="color:var(--danger,#ff453a)">*</span></label>
          <input id="topicInTitle" class="input" placeholder="例如：如何给入门读者讲清楚 XX">
          <div class="topic-err">标题不能为空。</div>
        </div>
        <div class="field"><label>标签（用逗号分隔）</label><input id="topicInTags" class="input" placeholder="例如：效率工具, 入门指南"></div>
        <div class="field" id="topicFieldLinks"><label>素材链接（每行一个 URL）</label>
          <textarea id="topicInLinks" class="input" style="height:auto;min-height:62px;padding:8px 10px;line-height:1.5;resize:vertical" placeholder="https://…"></textarea>
          <div class="topic-err">链接必须以 http:// 或 https:// 开头。</div>
        </div>
        <div class="field"><label>笔记</label><textarea id="topicInNotes" class="input" style="height:auto;min-height:76px;padding:8px 10px;line-height:1.5;resize:vertical" placeholder="选题动机、切入点、素材要点…"></textarea></div>
        <div class="field"><label>状态</label><select id="topicInStatus" class="input"></select></div>
      </div>
      <div class="modal-footer"><button class="btn" data-close>取消</button><button id="topicSaveBtn" class="btn btn-primary">保存选题</button></div>
    </div>
  </div>

  <div id="themeModal" class="modal hidden">
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <h3>编辑样式</h3>
        <button class="btn btn-icon modal-close" data-close aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="themeForm"></div>
      <div class="modal-footer theme-footer">
        <label class="keep-decor"><input type="checkbox" id="keepDecor" checked><span>保留主题装饰</span></label>
        <button id="resetStyleBtn" class="btn">恢复默认</button>
        <button id="cancelEditBtn" class="btn">取消</button>
        <input id="themeNameInput" class="input theme-name" placeholder="主题名称">
        <button id="saveThemeBtn" class="btn btn-primary">保存为主题</button>
      </div>
    </div>
  </div>

  <!-- 通用玻璃风下拉浮层（状态 / 排序共用，fixed 定位避免被滚动容器裁剪） -->
  <div id="tpDropdown" class="tp-dropdown hidden" role="listbox">
    <div class="tp-dd-head" id="tpDdHead">选择</div>
    <div class="tp-dd-list" id="tpDdList"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="lib/markdown-it.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/topics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
